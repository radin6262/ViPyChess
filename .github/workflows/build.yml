name: Build Testing Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android + Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          cmd /c "echo y|sdkmanager --licenses"

      - name: Install Requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Installation
        shell: pwsh
        run: |
          python --version
          java -version
          flutter --version
          flet --version

      ###############################################################
      # Android
      ###############################################################

      - name: Build Android APKs
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          flet build apk --split-per-abi

      - name: Collect ARM64 APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null

          $apk = Get-ChildItem -Recurse -Filter "*arm64-v8a*.apk" | Select-Object -First 1

          if ($null -eq $apk) {
            throw "arm64-v8a APK not found!"
          }

          Copy-Item $apk.FullName "release/ViPyChess.apk"

          Write-Host "Collected:"
          Get-ChildItem release\*.apk

      ###############################################################
      # Windows
      ###############################################################

      - name: Build Windows App
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          flet build windows

      - name: Package Windows Build
        shell: pwsh
        run: |
          if (!(Test-Path build/windows)) {
            throw "build/windows directory not found!"
          }

          Compress-Archive `
            -Path "build/windows/*" `
            -DestinationPath "release/ViPyChess-Windows.zip" `
            -Force

      ###############################################################
      # Upload Artifacts
      ###############################################################

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPyChess-Android
          path: release/ViPyChess.apk

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPyChess-Windows
          path: release/ViPyChess-Windows.zip