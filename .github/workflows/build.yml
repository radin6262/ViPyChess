name: Build Testing Artifacts

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installation
        run: |
          python --version
          flutter --version
          java -version
          flet --version

      - name: Build APK
        run: |
          flet build apk

      - name: Locate APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ViPyChess.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPyChess-Android
          path: release/ViPyChess.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installation
        shell: pwsh
        run: |
          python --version
          flet --version

      - name: Build Windows App
        shell: pwsh
        run: |
          flet build windows

      - name: Package Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/*" `
            -DestinationPath "ViPyChess-Windows.zip" `
            -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPyChess-Windows
          path: ViPyChess-Windows.zip