name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk

      - name: Locate APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ViPyChess.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/ViPyChess.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify
        shell: pwsh
        run: |
          python --version
          flet --version

      - name: Build Windows App
        shell: pwsh
        run: |
          flet build windows

      - name: Package Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/*" `
            -DestinationPath "ViPyChess-Windows.zip" `
            -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ViPyChess-Windows.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags

          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists!"
            exit 1
          fi

          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/ViPyChess.apk
            release/ViPyChess-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}