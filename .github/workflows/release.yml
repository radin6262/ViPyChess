name: Build And Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build Android + Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          cmd /c "echo y|sdkmanager --licenses"

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment
        shell: pwsh
        run: |
          python --version
          java -version
          flutter --version
          flet --version

      ####################################################################
      # Build Android
      ####################################################################

      - name: Build Android APK
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          flet build apk

      - name: Collect APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk | Select-Object -First 1

          if ($null -eq $apk) {
            throw "APK not found!"
          }

          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $apk.FullName release\ViPyChess.apk

      ####################################################################
      # Build Windows
      ####################################################################

      - name: Build Windows
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          flet build windows

      - name: Package Windows Build
        shell: pwsh
        run: |
          if (!(Test-Path build/windows)) {
            throw "build/windows directory not found!"
          }

          Compress-Archive `
            -Path "build/windows/*" `
            -DestinationPath "release/ViPyChess-Windows.zip" `
            -Force

      ####################################################################
      # Upload Build Artifacts
      ####################################################################

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/ViPyChess.apk

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/ViPyChess-Windows.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags

          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists!"
            exit 1
          fi

          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/ViPyChess.apk
            release/ViPyChess-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}